# haproxy-stack.yml
version: "3.8"

services:
  haproxy:
    image: haproxy:2.9-alpine
    configs:
      - source: haproxy_cfg_v5
        target: /usr/local/etc/haproxy/haproxy.cfg
    secrets:
      - taskmate_site_pem
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    networks:
      - proxy-net
    deploy:
      mode: global
      placement:
        constraints:
          - node.labels.role == ingress
      update_config:
        order: stop-first
        parallelism: 1
        delay: 10s

configs:
  haproxy_cfg_v5:
    file: ./haproxy.cfg

secrets:
  taskmate_site_pem:
    external: true

networks:
  proxy-net:
    external: true
